name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "tools/make_icon.py"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android project
        run: npx cap add android

      - name: App icon
        run: |
          python3 tools/make_icon.py 48  android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          python3 tools/make_icon.py 72  android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          python3 tools/make_icon.py 96  android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          python3 tools/make_icon.py 144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          python3 tools/make_icon.py 192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk calorie-tally.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calorie-tally-apk
          path: calorie-tally.apk

      - name: Publish APK to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Calorie Tally — Android APK" --notes "Installable Android APK for Calorie Tally (debug-signed, for sideloading). Download calorie-tally.apk below, open it on your Android phone, and allow installing from your browser/files app when asked. Your data stays on your phone. The newest build replaces the file here on every update."
          gh release upload apk-latest calorie-tally.apk --clobber
